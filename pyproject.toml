[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hero-on-probation"
version = "0.1.0"
description = "A short comic fantasy adventure about returning a frying pan."
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/hero_on_probation"]
